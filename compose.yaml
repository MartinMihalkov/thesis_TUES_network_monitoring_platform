services:
  db:
    image: mariadb:latest
    container_name: mariadb_container
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: platform
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mariadb.conf:/etc/mysql/mariadb.conf.d/50-server.cnf
    networks:
      app-net:
        ipv4_address: 192.168.200.2

  backend:
      build: ./backend
      container_name: node_backend_container
      restart: always
      ports:
      - "3000:3000"
      volumes:
        - ./backend:/app
        - /app/node_modules
      environment:
        DB_HOST: 192.168.200.2
        DB_USER: root
        DB_PASSWORD: root
        DB_NAME: platform
      depends_on:
        - db
      networks:
        app-net:
          ipv4_address: 192.168.200.4
  nginx:
    build: .
    container_name: nginx_container
    restart: always
    ports:
      - "8080:80"
      - "162:162/udp"
    volumes:
      - ./html:/usr/share/nginx/html
    depends_on:
      - backend
      - db
    networks:
      app-net:
        ipv4_address: 192.168.200.3

networks:
  app-net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24

volumes:
  db_data:
