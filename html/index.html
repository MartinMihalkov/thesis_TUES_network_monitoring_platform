<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue.js + PHP SPA</title>
    <!-- Вмъкване на Vue 3 чрез CDN -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f9f9f9; color: #333; }
        .container { max-width: 800px; margin: 0 auto; text-align: center; }
        .btn { background-color: #42b883; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn:hover { background-color: #35495e; }
        .alert { background-color: #d4edda; color: #155724; padding: 12px; border-radius: 4px; margin: 20px 0; }
        table { border-collapse: collapse; width: 100%; margin-top: 30px; text-align: left; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 12px; border: 1px solid #ddd; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <div id="app" class="container">
        <h2>Управление на потребители (Vue.js SPA)</h2>
        
        <!-- Бутон за създаване на запис -->
        <button @click="createUser" class="btn">Създай фиксиран запис</button>

        <!-- Известие за успех -->
        <div v-if="successMessage" class="alert">
            {{ successMessage }}
        </div>

        <!-- Таблица с потребители -->
        <h3>Текущ списък с потребители:</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Потребителско име</th>
                    <th>Хеш на паролата</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="user in users" :key="user.id">
                    <td>{{ user.id }}</td>
                    <td><strong>{{ user.username }}</strong></td>
                    <td><small style="color: #666;">{{ user.pass_hash }}</small></td>
                </tr>
                <tr v-if="users.length === 0">
                    <td colspan="3" style="text-align: center;">Няма намерени записи.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const users = ref([]);
                const successMessage = ref('');

                // 1. Функция за извличане на потребителите (SELECT)
                const fetchUsers = async () => {
                    try {
                        const response = await fetch('api.php');
                        const data = await response.json();
                        users.value = data;
                    } catch (error) {
                        console.error('Грешка при извличане на данни:', error);
                    }
                };

                // 2. Функция за създаване на потребител (POST)
                const createUser = async () => {
                    try {
                        const response = await fetch('api.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                        });
                        
                        const result = await response.json();
                        
                        if (result.success) {
                            successMessage.value = `Успешно добавен: ${result.username}`;
                            // Автоматично обновяваме списъка без презареждане на страницата
                            fetchUsers(); 
                            
                            // Скриване на съобщението след 3 секунди
                            setTimeout(() => successMessage.value = '', 3000);
                        }
                    } catch (error) {
                        console.error('Грешка при запис:', error);
                    }
                };

                // Извиква се автоматично при зареждане на приложението
                onMounted(fetchUsers);

                return {
                    users,
                    successMessage,
                    createUser
                };
            }
        }).mount('#app');
    </script>

</body>
</html>
