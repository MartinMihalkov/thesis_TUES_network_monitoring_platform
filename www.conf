[www]
; The user and group under which the processes will run.
; Use 'www-data' for Ubuntu/Debian, or 'nginx'/'apache' for CentOS/RHEL
user = nginx
group = nginx

; The address on which to accept FastCGI requests (Unix socket is recommended for speed).
listen = 0.0.0.0:9000

; Set permissions for the Unix socket to allow the web server to read/write.
;listen.owner = nginx
;listen.group = nginx
;listen.mode = 0660

; Process Management (Dynamic creates processes on demand)
pm = dynamic

; The maximum number of child processes allowed to run simultaneously.
pm.max_children = 5

; The number of child processes created on startup.
pm.start_servers = 2

; The desired minimum number of idle server processes.
pm.min_spare_servers = 1

; The desired maximum number of idle server processes.
pm.max_spare_servers = 3

; The number of requests each child process should execute before respawning.
; Useful to prevent memory leaks in third-party libraries.
pm.max_requests = 500

; Clear environment variables in FPM workers (security best practice)
clear_env = no

; Catch output from worker processes and log them (useful for debugging)
catch_workers_output = yes

